spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service-public
              order: 1
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/users/register,/api/v1/users/login

            - id: user-service
              order: 2
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/users/**
              filters:
                - name: JwtAuth

            - id: market-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/market/**
              filters:
                - name: JwtAuth

            - id: market-websocket
              uri: ws://localhost:8082
              predicates:
                - Path=/ws/**

            - id: order-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/orders/**
              filters:
                - name: JwtAuth

            - id: portfolio-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/portfolio/**
              filters:
                - name: JwtAuth



server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}

management:
  endpoint:
    gateway:
      access: unrestricted
  endpoints:
    web:
      exposure:
        include: health,info,gateway
